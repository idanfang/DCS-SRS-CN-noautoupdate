name: Chinese installer release
on:
  push:
    branches: [localize-2.4.1.0]
    paths:
      - '.github/workflows/cn-release.yml'
      - 'tools/build_cn_release.py'
      - 'tools/verify_cn_release.py'
    tags: ['v*-cn.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Chinese release tag to build
        required: true
        default: v2.4.1.0-cn.1
permissions:
  contents: write
concurrency:
  group: chinese-installer-release
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'idanfang/DCS-SRS-CN-noautoupdate'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v4
        with:
          path: automation
          persist-credentials: false
      - name: Select released source
        id: release
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = 'v2.4.1.0-cn.1'
          if ($env:INPUT_TAG) { $tag = $env:INPUT_TAG }
          elseif ($env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+\.\d+-cn\.\d+$') { throw 'Invalid release tag' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Checkout immutable released source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test released source
        working-directory: source
        run: dotnet test DCS-SR-CommonTests/DCS-SR-CommonTests.csproj -c Release --nologo
      - name: Build full installer layout
        run: python automation/tools/build_cn_release.py --source source --output release-output --tag '${{ steps.release.outputs.tag }}'
      - name: Verify bundles, dependencies, archive and hashes
        run: python automation/tools/verify_cn_release.py --source source --output release-output
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chinese-release-build-evidence
          path: |
            release-output/logs
            release-output/verification.json
            release-output/release-manifest.json
          if-no-files-found: warn
      - name: Attach verified installer to existing Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG -R idanfang/DCS-SRS-CN-noautoupdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = Get-ChildItem release-output/assets -File | ForEach-Object { $_.FullName }
          gh release upload $env:RELEASE_TAG @assets -R idanfang/DCS-SRS-CN-noautoupdate
          exit $LASTEXITCODE
